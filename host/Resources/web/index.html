// ---------- Keyboard ----------
// Hardware keys go as physical HID codes (the Mac's own input source does Korean composition).
// The soft keyboard types into a hidden textarea; committed text is sent as text.
const SENTINEL = " ";
let composing = false;

// On-screen keyboard, two ways to type (the choice is remembered):
//  바로   – straight onto the Mac as you type, like Chrome Remote Desktop (hidden #kbd).
//  입력창 – into a box above the keyboard first; 전송 puts it where the Mac's cursor is.
let keyboardMode = store.get("jump.keyboardMode") === "compose" ? "compose" : "direct";
let keyboardBlurAt = 0;
const keyboardOn = () => document.activeElement === ui.kbd || document.activeElement === ui.composeInput;

function setKeyboard(on) {
  // Show the right field first: a hidden (display: none) field can't take the focus.
  ui.kbar.classList.toggle("direct", keyboardMode === "direct");
  ui.kbar.classList.toggle("compose", keyboardMode === "compose");
  if (on) ui.kbar.classList.add("show");
  if (on && keyboardMode === "compose") {
    ui.composeInput.focus();
  } else if (on) {
    ui.kbd.value = SENTINEL;
    ui.kbd.focus();
  } else {
    ui.kbd.blur();
    ui.composeInput.blur();
  }
  updateKeyboardBar();
}

function updateKeyboardBar() {
  const on = ui.viewer.classList.contains("active") && keyboardOn();
  ui.kbar.classList.toggle("show", on);
  ui.kbar.classList.toggle("direct", keyboardMode === "direct");
  ui.kbar.classList.toggle("compose", keyboardMode === "compose");
  for (const button of ui.kbar.querySelectorAll(".seg button")) button.classList.toggle("on", button.dataset.mode === keyboardMode);
  ui.btnKbd.classList.toggle("on", on);

/** Sits the bar right on top of the keyboard (the visual viewport's bottom). */

  const vv = window.visualViewport;
  const bottom = vv ? vv.offsetTop + vv.height : innerHeight;
  ui.kbar.style.top = `${bottom - ui.kbar.offsetHeight}px`;

  ui.kbar.style.right = "auto";
  ui.kbar.style.width = `${vv ? vv.width : innerWidth}px`;
}

function setKeyboardMode(mode) {
  if (mode === keyboardMode) return;
  keyboardMode = mode;
  store.set("jump.keyboardMode", mode);

/** Runs [action] on a tap without taking the focus, so the on-screen keyboard stays open. */
function tapKeepingKeyboard(element, action) {
  element.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });
  element.addEventListener("touchend", (e) => { e.preventDefault(); action(); }, { passive: false });
  element.addEventListener("mousedown", (e) => e.preventDefault());
  element.addEventListener("click", action); // mouse and keyboard (touch never gets here)
}

  input.addEventListener("focus", () => updateKeyboardBar());
  input.addEventListener("blur", () => {
    keyboardBlurAt = performance.now();
    setTimeout(updateKeyboardBar, 0); // after the focus has landed wherever it goes
  });
}

// What 전송 put on the Mac (lengths in characters, newest last), so ✕ can take it back with
// Backspace; forgotten as soon as the Mac is clicked.
let sentChunks = [];
const characterCount = (text) => (window.Intl && Intl.Segmenter ? [...new Intl.Segmenter().segment(text)].length : [...text].length);

/** 입력창: the whole text goes to the Mac's cursor, pasted, so line breaks stay line breaks. */
function sendCompose() {
  const text = ui.composeInput.value;
  if (!text) return;
  send({ t: "text", s: text, paste: true });
  sentChunks = [...sentChunks, characterCount(text)].slice(-20);
  ui.composeUndo.disabled = false;
  ui.composeInput.value = "";
  fitComposeInput();
}

/** ✕: erases the last 전송 on the Mac, one Backspace per character; again for the one before. */
function eraseLastSent() {
  const count = Math.min(sentChunks.pop() || 0, 5000);
  for (let i = 0; i < count; i++) keyTap(HID("Backspace"));
  ui.composeUndo.disabled = sentChunks.length === 0;
}

function forgetSent() {
  if (!sentChunks.length) return;
  sentChunks = [];
  ui.composeUndo.disabled = true;
}

function fitComposeInput() {
  const input = ui.composeInput;
  input.style.height = "38px";

}

function keyTap(code) {
  send({ t: "key", code, down: true });
  send({ t: "key", code, down: false });
}

const ownsKeys = (target) => target instanceof Node && (ui.sheet.contains(target) || target === ui.composeInput);

// Modifiers the Mac currently holds down (HID codes), so each key press can carry the Shift,
// Control, Option and Command the browser says are down, even when the modifier's own key event
// never came (iPad keyboards don't always report the right-hand Shift, a key held across a
// focus change, …).
const heldModifiers = new Set();
// Windows / Android / Linux keyboards: Ctrl is the shortcut key (Ctrl+C, Ctrl+V, Ctrl+A), which on
// the Mac is ⌘. With this on, Ctrl goes to the Mac as ⌘ and the Windows key as Control.
const IS_APPLE_CLIENT = /Mac|iPhone|iPad|iPod/.test(navigator.platform || "") || /iPhone|iPad|Macintosh/.test(navigator.userAgent);
const ctrlAsCmd = () => ui.optCtrlCmd.checked;
const SWAPPED = { ControlLeft: "MetaLeft", ControlRight: "MetaRight", MetaLeft: "ControlLeft", MetaRight: "ControlRight" };
const macCode = (code) => (ctrlAsCmd() && SWAPPED[code]) || code;
const modifierPairs = () => ctrlAsCmd()
  ? [["shiftKey", "ShiftLeft", "ShiftRight"], ["ctrlKey", "MetaLeft", "MetaRight"],
     ["altKey", "AltLeft", "AltRight"], ["metaKey", "ControlLeft", "ControlRight"]]
  : [["shiftKey", "ShiftLeft", "ShiftRight"], ["ctrlKey", "ControlLeft", "ControlRight"],
     ["altKey", "AltLeft", "AltRight"], ["metaKey", "MetaLeft", "MetaRight"]];
function syncModifiers(e) {
  for (const [prop, left, right] of modifierPairs()) {
    const held = heldModifiers.has(HID(left)) || heldModifiers.has(HID(right));
    if (e[prop] && !held) {
      send({ t: "key", code: HID(left), down: true });
      heldModifiers.add(HID(left));
    } else if (!e[prop] && held) {
      for (const code of [HID(left), HID(right)]) {
        if (heldModifiers.delete(code)) send({ t: "key", code, down: false });
      }
    }
  }
}
const isModifierCode = (code) => code >= 0x700e0 && code <= 0x700e7;
// 한/영: "Lang1", or on many Korean PC keyboards the right Alt that Windows turns into it.
// The Mac switches its input source on this code (macOS itself ignores the key).
const keyCode = (e) => (e.key === "HangulMode" ? HID("Lang1") : HID(macCode(e.code)));

// Keys that are down on the Mac (DOM code -> what was sent), so a key comes up as what went down
// (Ctrl→⌘ may have been switched meanwhile) and nothing is left held when the page loses them.
const hardwareKeys = new Map();
const MODIFIER_CODES = ["ShiftLeft", "ShiftRight", "ControlLeft", "ControlRight", "AltLeft", "AltRight", "MetaLeft", "MetaRight"];
function releaseHeldKeys(sendTo = send) {
  for (const code of hardwareKeys.values()) sendTo({ t: "key", code, down: false });
  for (const name of MODIFIER_CODES) sendTo({ t: "key", code: HID(name), down: false });
  hardwareKeys.clear();
  heldModifiers.clear();
}

// A physical keyboard while the on-screen keyboard's field has the focus (an iPad with a keyboard
// attached, ⌨ open): its keys go to the Mac as keys, where the Mac's own input source composes
// Korean, and whatever this device's input method makes of them locally is dropped. The
// on-screen keyboard has no physical keys (no `code`); its text is still typed as text.
let hardwareTypingUntil = 0;
const hardwareTyping = () => performance.now() < hardwareTypingUntil;

window.addEventListener("keydown", (e) => {
  if (!ui.viewer.classList.contains("active") || ownsKeys(e.target)) return;
  const code = keyCode(e);
  if (!code) return; // the on-screen keyboard: its text arrives through the field below
  if (document.activeElement === ui.kbd) hardwareTypingUntil = performance.now() + 1500;
  if (isModifierCode(code)) heldModifiers.add(code);
  else syncModifiers(e);
  if (clipboard.startPaste(e)) return; // no preventDefault: the browser's paste event comes next
  e.preventDefault();
  if (!isModifierCode(code)) hardwareKeys.set(e.code || e.key, code);
  send({ t: "key", code, down: true });
});

window.addEventListener("keyup", (e) => {
  if (!ui.viewer.classList.contains("active") || ownsKeys(e.target)) return;
  const held = hardwareKeys.get(e.code || e.key);
  const code = held || keyCode(e);
  if (!code) return;
  hardwareKeys.delete(e.code || e.key);
  e.preventDefault();
  if (e.code === "KeyV" && clipboard.swallowKeyUp) { clipboard.swallowKeyUp = false; return; } // sent with the paste
  if (isModifierCode(code)) {
    // Some keyboards report the right-hand key going up as the left one: release the pair.
    const pair = modifierPairs().find(([, left, right]) => code === HID(left) || code === HID(right));
    for (const side of [HID(pair[1]), HID(pair[2])]) {
      if (heldModifiers.delete(side) || side === code) send({ t: "key", code: side, down: false });
    }
    return;
  }
  send({ t: "key", code, down: false });
});

// Don't leave keys stuck on the Mac when the page loses the keyboard (another tab or app).
window.addEventListener("blur", () => releaseHeldKeys());
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseHeldKeys(); });

ui.kbd.addEventListener("beforeinput", (e) => { if (hardwareTyping() && e.cancelable) e.preventDefault(); });
ui.kbd.addEventListener("compositionstart", () => { composing = true; });
ui.kbd.addEventListener("compositionupdate", (e) => { ui.kbarPreview.textContent = hardwareTyping() ? "" : e.data || ""; });
ui.kbd.addEventListener("compositionend", () => {
  composing = false;
  ui.kbarPreview.textContent = "";
  if (hardwareTyping()) ui.kbd.value = SENTINEL; // already sent as keys
  else flushSoftKeyboard();
});
ui.kbd.addEventListener("input", () => {
  if (composing) return;
  if (hardwareTyping()) ui.kbd.value = SENTINEL; // already sent as keys
  else flushSoftKeyboard();
});

function flushSoftKeyboard() {
  const value = ui.kbd.value;
  if (value.length < SENTINEL.length) {
    keyTap(HID("Backspace"));
  } else if (value.length > SENTINEL.length) {
    const text = value.slice(SENTINEL.length);
    if (text === "\n") keyTap(HID("Enter"));
    else send({ t: "text", s: text });
  }
  ui.kbd.value = SENTINEL;
}

// Mac -> here: text the Mac copies is put on this device's clipboard, right away where the
// browser allows it, else on the next tap or key press (Safari and plain http need a gesture).
// Here -> Mac: Cmd/Ctrl+V first sends this device's clipboard, then the keystroke, so the Mac
// pastes what was copied here.
const CLIP_MAX_BYTES = 60000;
const clipboard = {
  pending: null,
  last: null, // text both sides already have: never bounced back and forth
  pasteKey: null, // { code, timer } while waiting for the browser's paste event
  swallowKeyUp: false, // the V of a taken-over paste: its release was already sent
  get on() { return ui.optClip.checked; },

  receive(text) {
    if (!this.on || typeof text !== "string" || text === this.last) return;
    this.pending = text;
    if (navigator.clipboard && navigator.clipboard.writeText && document.hasFocus()) {
      navigator.clipboard.writeText(text).then(() => this.done(text), () => {});
    }
  },

  /** Called from inside a user gesture. */
  flush() {
    const text = this.pending;
    if (text == null) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => this.done(text), () => { if (copyWithSelection(text)) this.done(text); });
    } else if (copyWithSelection(text)) {
      this.done(text);
    }
  },

  done(text) {
    if (this.pending !== text) return;
    this.pending = null;
    this.last = text;
    toast("📋 Mac에서 복사한 내용을 가져왔습니다");
  },

  /** Cmd/Ctrl+V pressed on the viewer: returns true when it takes over the keystroke. */
  startPaste(e) {
    if (!this.on || this.pasteKey || e.code !== "KeyV" || !(e.metaKey || e.ctrlKey) || e.altKey) return false;
    // Let the browser fire "paste" (so we can read what was copied here); send the V after.
    this.pasteKey = { code: HID("KeyV"), timer: setTimeout(() => this.finishPaste(null), 150) };
    this.swallowKeyUp = true;
    return true;
  },

  finishPaste(text) {
    const key = this.pasteKey;
    if (!key) return;
    clearTimeout(key.timer);
    this.pasteKey = null;
    if (text) {
      if (new TextEncoder().encode(text).length <= CLIP_MAX_BYTES) {
        send({ t: "clip", text });
        this.last = text;
      }
      else toast("복사한 내용이 너무 커서 Mac으로 보내지 않았습니다");
    }
    send({ t: "key", code: key.code, down: true });
    send({ t: "key", code: key.code, down: false });
  },
};
for (const type of ["pointerup", "keydown", "touchend"]) {
  window.addEventListener(type, () => clipboard.flush(), true);
}
document.addEventListener("paste", (e) => {
  if (!clipboard.pasteKey) return;
  e.preventDefault();
  clipboard.finishPaste(e.clipboardData ? e.clipboardData.getData("text/plain") : null);
});

/** Copy without the async Clipboard API (plain http, older Safari): select text and copy. */
function copyWithSelection(text) {
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;";
  const active = document.activeElement;
  document.body.appendChild(area);
  area.select();
  area.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch {}
  area.remove();
  if (active && active !== document.body && active.focus) active.focus({ preventScroll: true });
  return ok;
}

// ---------- Monitors ----------
function updateDisplayTile() {
  const info = session && session.displays;
  const list = info ? info.list : [];
  ui.btnDisplay.style.display = list.length > 1 ? "" : "none";
  if (list.length > 1) {
    const index = Math.max(0, list.findIndex((d) => d.id === info.current));
    setTile(ui.btnDisplay, "🖥", `모니터\n${index + 1}/${list.length}`);
    ui.btnDisplay.title = list[index].name;
  }
  layoutViewer();
}
ui.btnDisplay.addEventListener("click", () => {
  const info = session && session.displays;
  if (!info || info.list.length < 2) return;
  const index = info.list.findIndex((d) => d.id === info.current);
  const next = info.list[(index + 1) % info.list.length];
  send({ t: "selectDisplay", id: next.id });
  toast(`🖥 ${next.name}`);
});
ui.sheetForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const current = ui.pwCurrent.value;
  const next = ui.pwNew.value.trim();
  if (!current) return setPwStatus("현재 비밀번호를 입력하세요", "error");
  if (next.length < 8) return setPwStatus("새 비밀번호는 8자 이상이어야 합니다", "error");
  if (next !== ui.pwConfirm.value.trim()) return setPwStatus("새 비밀번호 확인이 다릅니다", "error");
  if (!session) return setPwStatus("연결되어 있지 않습니다", "error");
  ui.pwSave.disabled = true;
  setPwStatus("변경 중…");
  const result = await session.changePassword(current, next);
  ui.pwSave.disabled = false;
  if (!result.ok) return setPwStatus(result.error || "변경하지 못했습니다", "error");
  session.password = next;
  savePassword(next);
  ui.password.value = next;
  for (const field of pwFields) field.value = "";
  setPwStatus("변경했습니다. 다음 접속부터 새 비밀번호로 들어옵니다.", "ok");
});
const standalone = navigator.standalone === true || matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches;
// Home-screen apps are already full screen; iPhone Safari has no element fullscreen at all.
const canFullscreen = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
if (standalone || !canFullscreen) ui.btnFull.style.display = "none";
ui.btnFull.addEventListener("click", () => {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    // Chrome/Edge: in full screen, also take shortcuts like Cmd+W/T/N and Esc for the Mac
    // (hold Esc to leave full screen).
    Promise.resolve((el.requestFullscreen || el.webkitRequestFullscreen).call(el))
      .then(() => navigator.keyboard && navigator.keyboard.lock && navigator.keyboard.lock())
      .catch(() => {});
  }
});
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock();
});
ui.btnClose.addEventListener("click", () => {
  if (session) session.close();
  session = null;
  cancelReconnect();
  leaveViewer();
  setStatus("연결을 끊었습니다.");
});

</script>
